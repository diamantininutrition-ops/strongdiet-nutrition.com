<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Inter Tight";
        src: url("fonts/InterTight.ttf") format("truetype");
        font-weight: 100 900;
        font-style: normal;
        font-display: block;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        background: #0a0a0a;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 1200px;
        height: 630px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
      }
      .mark {
        width: 16px;
        height: 16px;
        margin-bottom: 44px;
        display: block;
      }
      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        line-height: 0.86;
      }
      .strong,
      .diet {
        font-family: "Inter Tight", ui-sans-serif, sans-serif;
        font-size: 152px;
        letter-spacing: -0.05em;
        font-synthesis: none;
      }
      .strong {
        font-weight: 600;
        color: #c9a227;
      }
      .diet {
        font-weight: 500;
        color: #f5f5f7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#C9A227" d="M16 3.2 28.8 16 16 28.8 3.2 16 16 3.2z" />
      </svg>
      <div class="lockup">
        <div class="strong">STRONG</div>
        <div class="diet">DIET</div>
      </div>
    </div>
  </body>
</html>
